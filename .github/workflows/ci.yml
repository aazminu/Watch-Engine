name: Watch-Engine CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: node --test tests/hybridSearchEngine.test.js
      - name: Verify CLI commands
        run: |
          node backend/cli.js search "blue titanium diver under 4500"
          node backend/cli.js eval
          node backend/cli.js price-audit
